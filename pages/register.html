<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="/logo.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/site.css"><title>Register — Global AI Discovery Programme 2026</title></head><body>
<header><a class="brand" href="/"><img class="logo" src="/logo.png" alt="" width="40" height="40">Midsoft</a></header>
<main>
  <div class="steps"><span class="on">1 · Your details</span><span>2 · Pay ₹29</span><span>3 · Done</span></div>
  <h1>Register for the programme</h1><p class="sub">Tell us about yourself. Payment of ₹29 comes next.</p>
  <form class="card" id="regForm">
    <div class="field"><label for="fullName">Full name</label><input id="fullName" name="fullName" autocomplete="name" required maxlength="100"></div>
    <div class="two">
      <div class="field"><label for="email">Email</label><input type="email" id="email" name="email" autocomplete="email" required maxlength="254"></div>
      <div class="field"><label for="phone">Phone</label><input type="tel" id="phone" name="phone" autocomplete="tel" inputmode="tel" required maxlength="20" placeholder="10-digit number"></div>
    </div>
    <div class="two">
      <div class="field"><label for="category">I am a</label><select id="category" name="category" required><option value="" disabled selected>Select one</option><option>Student</option><option>Educator</option><option>Professional</option><option>Entrepreneur</option><option>AI beginner</option><option>Other</option></select></div>
      <div class="field"><label for="country">Country</label><input id="country" name="country" autocomplete="country-name" required maxlength="60" placeholder="e.g. India"></div>
    </div>
    <div class="field"><label for="org">College / Organisation (optional)</label><input id="org" name="org" maxlength="150"></div>
    <button class="btn" type="submit">Continue to payment — ₹29</button>
    <div id="formMsg" class="form-msg" role="alert"></div>
  </form>
</main>
<footer>© 2026 Midsoft. All rights reserved.</footer>
<script src="/js/register.js"></script></body></html>
